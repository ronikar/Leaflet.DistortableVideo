<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Rotated video &mdash; Leaflet.DistortableVideo</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>
    <link rel="stylesheet" type="text/css" href="main.css">
</head>

<body>
    <a id="back" href="./">&larr; All examples</a>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
    <script src="../dist/index.js" type="text/javascript"></script>
    <script>
        var map = L.map('map');

        L.tileLayer('https://server.arcgisonline.com/arcgis/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 18,
            attribution: 'Map data &copy; <a href="https://developers.arcgis.com">ArcGis</a>'
        }).addTo(map);

        // media/rotated.mp4 is NASA GIBS imagery turned 30 degrees off north-up by
        // tools/make-demo-video.mjs. These corners came from that same run, so the
        // overlay has to rotate the footage back to make the coastlines line up
        // with the basemap - a real projective placement, not a scale.
        var corners = {
            topLeft: L.latLng([24.169729, -133.16373]),
            topRight: L.latLng([37.034354, -107.182968]),
            bottomRight: L.latLng([21.477765, -96.83627]),
            bottomLeft: L.latLng([6.98185, -122.817032])
        };

        map.fitBounds([[6.9, -133.2], [37.1, -96.8]]);

        L.distortableVideoOverlay("media/rotated.mp4", corners, {
            muted: true,
            autoplay: true,
            loop: true,
            opacity: 0.85
        }).addTo(map);

        Object.keys(corners).forEach(function (name) {
            L.marker(corners[name]).addTo(map).bindPopup(name);
        });
    </script>
</body>

</html>
