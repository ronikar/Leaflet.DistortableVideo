<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Point array &mdash; Leaflet.DistortableVideo</title>
    <link rel="stylesheet" href="vendor/leaflet.css"/>
    <link rel="stylesheet" type="text/css" href="main.css">
</head>

<body>
    <a id="back" href="./">&larr; All examples</a>
    <div id="map"></div>

    <script src="vendor/leaflet.js"></script>
    <script src="../dist/index.js" type="text/javascript" /></script>
    <script>
        var map = L.map('map');

        // Offline fallback: a static basemap in a pane below the tiles. When the
        // tile layer loads it covers this completely; with no network it is what
        // you see, so the video still has recognisable ground to be registered
        // against. media/basemap.jpg is GIBS Blue Marble, requested in EPSG:3857
        // so an image overlay places it without latitude distortion.
        map.createPane('fallback');
        map.getPane('fallback').style.zIndex = 150;
        L.imageOverlay('media/basemap.jpg', [[0, -140], [45, -85]], { pane: 'fallback' }).addTo(map);

        L.tileLayer('https://server.arcgisonline.com/arcgis/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 18,
            attribution: 'Map data &copy; <a href="https://developers.arcgis.com">ArcGis</a>',
            id: 'mapbox.satellite'
        }).addTo(map);

        var mapBounds = [[6.9, -133.2], [37.1, -96.8]];

        // media/pacific-rotated.mp4 is satellite imagery stored 30 degrees off
        // north-up. These are the corners of the ground it actually covers, so the
        // overlay has to rotate it back into place - which is the whole job of this
        // plugin. Without that, footage like this could not sit on a map at all.
        var topLeft = L.latLng([24.169729, -133.16373]);
        var topRight = L.latLng([37.034354, -107.182968]);
        var bottomRight = L.latLng([21.477765, -96.83627]);
        var bottomLeft = L.latLng([6.98185, -122.817032]);
        var corners = [topLeft, topRight, bottomRight, bottomLeft];

        map.fitBounds(mapBounds);

        var layer = L.distortableVideoOverlay("media/pacific-rotated.mp4", corners, {
            muted: true,
            opacity: 0.8
        }).addTo(map);

        function addMarker(point, text) {
            L.marker(point).addTo(map).bindPopup(text);
        }

        addMarker(topLeft, "I'm topLeft :)");
        addMarker(topRight, "I'm topRight :p");
        addMarker(bottomRight, "I'm bottomRight :o");
        addMarker(bottomLeft, "I'm bottomLeft <3");
    </script>

</body>

</html>
