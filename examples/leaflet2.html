<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Leaflet 2 &mdash; Leaflet.DistortableVideo</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@2.0.0-alpha.1/dist/leaflet.css" />
    <link rel="stylesheet" type="text/css" href="main.css">
    <style>
        #shapes {
            position: absolute;
            z-index: 1000;
            top: 20px;
            right: 20px;
            padding: 12px 14px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.35);
            font: 13px/1.4 system-ui, -apple-system, sans-serif;
            color: #1e2530;
        }

        #shapes h2 {
            margin: 0 0 8px;
            font-size: 11px;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            color: #5c6675;
        }

        #shapes div {
            display: flex;
            gap: 6px;
        }

        #shapes button {
            font: 600 12.5px/1 system-ui, -apple-system, sans-serif;
            padding: 7px 11px;
            border: 1px solid #c6ccd6;
            border-radius: 5px;
            background: #fff;
            color: #1e2530;
            cursor: pointer;
        }

        #shapes button[aria-pressed="true"] {
            background: #1667c4;
            border-color: #1667c4;
            color: #fff;
        }

        #shapes button:focus-visible {
            outline: 2px solid #1667c4;
            outline-offset: 2px;
        }

        #version {
            margin-top: 10px;
            font-size: 11.5px;
            color: #5c6675;
        }
    </style>
</head>

<body>
    <a id="back" href="./">&larr; All examples</a>

    <section id="shapes">
        <h2>Bounds input</h2>
            <p style="margin:0 0 8px;font-size:12px;color:#5c6675">Corners and point array carry footage stored 30&deg; off north-up. <code>LatLngBounds</code> is axis-aligned, so it gets the north-up clip.</p>
        <div role="group" aria-label="Choose the bounds input shape">
            <button type="button" data-shape="corners" aria-pressed="true">Corners</button>
            <button type="button" data-shape="bounds" aria-pressed="false">LatLngBounds</button>
            <button type="button" data-shape="points" aria-pressed="false">Point array</button>
        </div>
        <p id="version"></p>
    </section>

    <div id="map"></div>

    <!-- Leaflet 2's default entry point is an ES module. `leaflet-global.js` is the
         build that still exposes the global `L`, which is what a plain <script>
         page and this plugin's UMD bundle both expect. -->
    <script src="https://unpkg.com/leaflet@2.0.0-alpha.1/dist/leaflet-global.js"></script>
    <script src="../dist/index.js"></script>
    <script>
        // Leaflet 2 replaced the lowercase factories with constructors:
        //   L.map(...)       ->  new L.Map(...)
        //   L.latLng(...)    ->  new L.LatLng(...)
        //   L.tileLayer(...) ->  new L.TileLayer(...)
        var map = new L.Map('map');

        new L.TileLayer('https://server.arcgisonline.com/arcgis/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 18,
            attribution: 'Map data &copy; <a href="https://developers.arcgis.com">ArcGis</a>'
        }).addTo(map);

        // The rotated clip is stored 30 degrees off north-up; these are the corners
        // of the ground it actually covers. The north-up clip covers a plain box.
        var ROTATED = {
            url: 'media/pacific-rotated.mp4',
            corners: {
                topLeft: new L.LatLng(24.169729, -133.16373),
                topRight: new L.LatLng(37.034354, -107.182968),
                bottomRight: new L.LatLng(21.477765, -96.83627),
                bottomLeft: new L.LatLng(6.98185, -122.817032)
            }
        };
        var NORTH_UP = { url: 'media/pacific.mp4', bounds: [[32, -130], [13, -100]] };

        map.fitBounds([[6.9, -133.2], [37.1, -96.8]]);

        var labels = ["topLeft", "topRight", "bottomRight", "bottomLeft"];
        var markers = labels.map(function (label) {
            return new L.Marker(ROTATED.corners[label]).addTo(map).bindPopup(label);
        });

        // A LatLngBounds is axis-aligned by definition, so it cannot describe the
        // rotated clip's footprint - that shape gets the north-up clip instead, and
        // each shape is shown on footage it can actually register. Swapping the clip
        // means rebuilding the layer, which is a couple of lines and keeps every
        // mode honest rather than leaving one of them misplaced.
        var layer = null;
        var VIDEO_OPTIONS = { muted: true, autoplay: true, loop: true, opacity: 0.85 };

        var shapes = {
            corners: function () {
                layer = L.distortableVideoOverlay(ROTATED.url, ROTATED.corners, VIDEO_OPTIONS);
                return labels.map(function (l) { return ROTATED.corners[l]; });
            },
            bounds: function () {
                // setBounds() is the call that used to throw on Leaflet 2, because it
                // reaches L.latLngBounds() - the one factory the plugin depended on.
                layer = L.distortableVideoOverlay(NORTH_UP.url, ROTATED.corners, VIDEO_OPTIONS);
                layer.setBounds(NORTH_UP.bounds);
                var box = new L.LatLngBounds(NORTH_UP.bounds);
                return [box.getNorthWest(), box.getNorthEast(), box.getSouthEast(), box.getSouthWest()];
            },
            points: function () {
                var clockwise = labels.map(function (l) { return ROTATED.corners[l]; });
                layer = L.distortableVideoOverlay(ROTATED.url, clockwise, VIDEO_OPTIONS);
                return clockwise;
            }
        };

        function selectShape(name) {
            if (layer) { layer.remove(); }
            var corners = shapes[name]();
            layer.addTo(map);
            corners.forEach(function (corner, index) { markers[index].setLatLng(corner); });
        }

        selectShape('corners');

        var buttons = document.querySelectorAll('#shapes button');
        buttons.forEach(function (button) {
            button.addEventListener('click', function () {
                buttons.forEach(function (other) {
                    other.setAttribute('aria-pressed', String(other === button));
                });
                selectShape(button.dataset.shape);
            });
        });

        document.getElementById('version').textContent = 'Running Leaflet ' + L.version;
    </script>
</body>

</html>
