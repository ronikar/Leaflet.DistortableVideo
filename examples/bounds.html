<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>LatLngBounds &mdash; Leaflet.DistortableVideo</title>
    <link rel="stylesheet" href="vendor/leaflet.css"/>
    <link rel="stylesheet" type="text/css" href="main.css">
</head>

<body>
    <a id="back" href="./">&larr; All examples</a>
    <div id="map"></div>

    <script src="vendor/leaflet.js"></script>
    <script src="../dist/index.js" type="text/javascript" /></script>
    <script>
        var map = L.map('map');

        // Offline fallback: a static basemap in a pane below the tiles. When the
        // tile layer loads it covers this completely; with no network it is what
        // you see, so the video still has recognisable ground to be registered
        // against. media/basemap.jpg is GIBS Blue Marble, requested in EPSG:3857
        // so an image overlay places it without latitude distortion.
        map.createPane('fallback');
        map.getPane('fallback').style.zIndex = 150;
        L.imageOverlay('media/basemap.jpg', [[0, -140], [45, -85]], { pane: 'fallback' }).addTo(map);

        L.tileLayer('https://server.arcgisonline.com/arcgis/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 18,
            attribution: 'Map data &copy; <a href="https://developers.arcgis.com">ArcGis</a>',
            id: 'mapbox.satellite'
        }).addTo(map);

        mapBounds = [[32, -130], [13, -100]];
        map.fitBounds(mapBounds);

        var layer = L.distortableVideoOverlay("media/pacific.mp4", mapBounds, {
            muted: true,
            opacity: 0.8
        }).addTo(map);

    </script>
</body>

</html>
