<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Demo - Rotated map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-rotate-map@0.3.2/leaflet.css" />
    <link rel="stylesheet" type="text/css" href="main.css">
    <style>
        #controls {
            position: absolute;
            z-index: 1000;
            top: 10px;
            right: 10px;
            background: #fff;
            border: 1px solid #bbb;
            border-radius: 5px;
            padding: 10px 12px;
            font: 13px/1.5 sans-serif;
            box-shadow: 0 1px 5px rgba(0, 0, 0, .4);
        }

        #controls label {
            display: block;
            margin-bottom: 6px;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <div id="controls">
        <label>bearing <b><span id="bearingValue">45</span>&deg;</b></label>
        <input id="bearing" type="range" min="0" max="360" step="1" value="45">
    </div>

    <!-- leaflet-rotate-map is a drop-in replacement for leaflet, not an add-on:
         it provides the whole L namespace plus map rotation. -->
    <script src="https://unpkg.com/leaflet-rotate-map@0.3.2/leaflet-src.js" type="text/javascript"></script>
    <script src="../dist/index.js" type="text/javascript"></script>
    <script>
        // `rotate: true` is what enables map.setBearing().
        var map = L.map('map', { rotate: true });

        L.tileLayer('https://server.arcgisonline.com/arcgis/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 18,
            attribution: 'Map data &copy; <a href="https://developers.arcgis.com">ArcGis</a>'
        }).addTo(map);

        var mapBounds = [[32, -130], [13, -100]];

        var topLeft = L.latLng([30.6, -129]);
        var topRight = L.latLng([32, -100]);
        var bottomRight = L.latLng([13, -97]);
        var bottomLeft = L.latLng([13, -130]);
        var corners = { topLeft: topLeft, topRight: topRight, bottomRight: bottomRight, bottomLeft: bottomLeft };

        map.fitBounds(mapBounds);

        var layer = L.distortableVideoOverlay("https://www.mapbox.com/bites/00188/patricia_nasa.mp4", corners, {
            muted: true,
            opacity: 0.8
        }).addTo(map);

        function addMarker(point, text) {
            L.marker(point).addTo(map).bindPopup(text);
        }

        addMarker(topLeft, "I'm topLeft :)");
        addMarker(topRight, "I'm topRight :p");
        addMarker(bottomRight, "I'm bottomRight :o");
        addMarker(bottomLeft, "I'm bottomLeft <3");

        // Rotate the map. The overlay needs no special handling: the video lives
        // inside the rotate pane, so the pane's rotation composes with the
        // matrix3d the plugin computes from unrotated layer points.
        var slider = document.getElementById('bearing');
        var readout = document.getElementById('bearingValue');

        function applyBearing() {
            readout.textContent = slider.value;
            map.setBearing(Number(slider.value));
        }

        slider.addEventListener('input', applyBearing);
        applyBearing();
    </script>
</body>

</html>
